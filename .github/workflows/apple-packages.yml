name: Apple builds

# Build and test checks only. CTRPad apps are compiled from the CTR-ModSDK
# decompilation, so this workflow never uploads or publishes an app. Releases
# publish the PadMint recipe (padmint.json) and SHA256SUMS only; players build
# their own copy with PadMint.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: brew install cmake ninja
      - name: Build and package
        run: ./package-macos.sh --build --output "$RUNNER_TEMP/CTRPad-macos-check.zip"
      - name: Test runtime and logger
        run: |
          ctest --preset macos-arm64-app --output-on-failure
          python3 tools/test-native-log.py
          python3 tools/test-diagnostics.py
          python3 tools/test-source-lock.py

  ios:
    name: Unsigned iPhone and iPad app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: brew install cmake ninja
      - name: Build and package
        run: ./package-ios.sh --build --output "$RUNNER_TEMP/CTRPad-ios-check.ipa"

  source:
    name: Corresponding source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package corresponding source
        run: ./package-source.sh
      - name: Check the PadMint recipe and version
        run: |
          python3 - <<'PY'
          import json
          recipe = json.load(open("padmint.json"))
          version = json.load(open("version.json"))
          assert recipe["id"] == "ctrpad", recipe["id"]
          assert recipe["publication"]["public_binaries"] is False, "CTRPad must never publish apps"
          assert isinstance(version["version"], str) and version["version"], version
          assert isinstance(version["build"], int) and version["build"] > 0, version
          print("padmint.json and version.json OK:", version["version"], "build", version["build"])
          PY
